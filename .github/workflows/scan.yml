name: scan

on:
  workflow_dispatch:        # the "Run workflow" button — this is the on-demand path
  schedule:
    - cron: "0 6 * * 1,4"   # Mon + Thu, 06:00 UTC

# The scan is stateless — it reads nothing personal and commits nothing. It only needs
# to read the repo, publish the page, and mint the Pages token.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: job-radar-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Core deps only: the LinkedIn/Indeed sweeps are `ci: false` (they block
      # datacenter IPs), so their ~120 MB of pandas/numpy is dead weight here.
      - run: pip install -r requirements-core.txt

      - name: Scan boards
        run: |
          python jobradar.py scan \
            --ci \
            --out site/index.html \
            --markdown "$RUNNER_TEMP/digest.md"

      - name: Job summary
        if: always()
        run: cat "$RUNNER_TEMP/digest.md" >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
