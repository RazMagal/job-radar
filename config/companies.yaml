  # ---- Big tech via their own public career APIs (not a third-party ATS) -----
  # These run their own careers sites, but each exposes a public JSON search with a
  # server-side location filter — so we can pull just the Israel roles, same as an ATS.
  - name: Amazon               # Annapurna Labs silicon (Graviton/Trainium) + AWS + Stores
    type: amazon
    location: Israel
    country: ISR

  # Qualcomm and Microsoft both run Eightfold's public "PCSX" search API (same shape,
  # different host+domain — see jobradar/sources/eightfold.py).
  - name: Qualcomm             # Snapdragon modem/RF/camera silicon — ASIC, firmware, validation
    type: qualcomm
    location: Israel

  - name: Microsoft            # Azure / security / AI R&D (Herzliya, Haifa, Tel Aviv)
    type: microsoft
    location: Israel

  # Google has no clean API left — this reads the careers-page batchexecute RPC. It's the
  # most fragile source (a Google deploy can rotate the RPC id, which `check` will catch);
  # worth it for ~100 IL roles incl. silicon validation and CPU design verification.
  - name: Google               # silicon validation, CPU DV, TPU, SoC power + SWE/AI
    type: google
    location: Israel

  # Texas Instruments on Oracle Recruiting Cloud. host/site/location_id were read off the
  # careers.ti.com hcmRestApi XHR; location_id is the Israel GeographyId facet.
  - name: Texas Instruments    # Ra'anana chip R&D — design verification, digital design, emulation
    type: oracle
    host: edbz.fa.us2.oraclecloud.com
    site: CX
    location_id: "300000000361478"
    job_url: "https://careers.ti.com/job/{id}"

  # ---- Known-unreachable, documented so nobody re-tries them ----------------
  # Big chip employers this tool can't reach today — each probed live across
  # wd1/wd3/wd5 and every plausible token; none has a public Workday/Greenhouse/Lever/
  # Ashby/SmartRecruiters/Comeet board. Supporting them means a new adapter for the ATS
  # named against each.
  #
  #   Qualcomm            Eightfold AI  (app.eightfold.ai/careers?domain=qualcomm.com)
  #   Synopsys            Avature       (synopsys.avature.net)
  #   AMD                 iCIMS         (careers-amd.icims.com)
  #   Arm                 iCIMS         (experienced-arm.icims.com)
  #   Texas Instruments   Oracle HCM    (careers.ti.com)
  #   Vayyar              Workable      (apply.workable.com/vayyar — currently empty)
  #   Tower Semiconductor SuccessFactors (jobs.towersemi.com — has live Israel roles)
  #   Apple, Western Digital            Workday exists but returns 401 (internal)
  #   Google, Microsoft, Amazon, Nokia  proprietary career sites
  #
  # Israeli chip firms whose jobs live only on their own site (no third-party ATS):
  #   Valens (WordPress), Weebit Nano (own site), Silicom (WP job-openings), Speedata
  #   (Wix — has live VLSI/DV roles, apply by email), SatixFy (acquired by MDA Space).
  #   Pliops and Autotalks had Comeet boards now deactivated/empty (Autotalks -> Qualcomm).
  #   Run:ai is now NVIDIA — covered by the NVIDIA Workday entry above.
  #
  # Until then these are best covered by the LinkedIn/Indeed sweeps below, which do
  # surface Qualcomm and Google Israel postings.

  # ---- LinkedIn + Indeed sweeps via jobspy ----------------------------------
  # Installed by default via requirements.txt. Verified working for Israel on
  # 2026-07-20 from a residential IP: both boards returned real, on-topic Israeli
  # postings. LinkedIn blocks datacenter IPs, so these are `ci: false` — run them
  # locally. Glassdoor is unsupported (no Israel domain; it aborts the batch).
  #
  # One entry per search term: these are keyword searches, not full board dumps,
  # so each role you care about needs its own sweep.
  - name: LinkedIn/Indeed — verification
    type: jobspy
    ci: false
    sites: [indeed, linkedin]
    search_term: verification engineer
    location: Israel
    country: israel
    results: 50
    hours_old: 336

  - name: LinkedIn/Indeed — chip design
    type: jobspy
    ci: false
    sites: [indeed, linkedin]
    search_term: ASIC RTL design engineer
    location: Israel
    country: israel
    results: 50
    hours_old: 336

  - name: LinkedIn/Indeed — linux
    type: jobspy
    ci: false
    sites: [indeed, linkedin]
    search_term: linux embedded developer
    location: Israel
    country: israel
    results: 50
    hours_old: 336
