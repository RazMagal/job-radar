# Where to look. Each entry is one careers board.
#
# Every board below was verified live with `./jobradar.py check`. Re-run that after
# any edit — board tokens change, and a stale token otherwise fails silently as
# "zero jobs" rather than an error.
#
# How to find the token for a company:
#   greenhouse       boards.greenhouse.io/<board>        -> board: <board>
#   lever            jobs.lever.co/<board>               -> board: <board>
#   ashby            jobs.ashbyhq.com/<board>            -> board: <board>
#   smartrecruiters  jobs.smartrecruiters.com/<company>  -> board: <company>
#   workday          <tenant>.<wd>.myworkdayjobs.com/<site>
#                    e.g. nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite
#                    -> tenant: nvidia   wd: wd5   site: NVIDIAExternalCareerSite
#
# Workday status codes (verified against a known-good board — they are the opposite
# way round from what you'd expect):
#   404 = tenant is right, `site` is wrong (read it off the careers page URL)
#   422 = no public Workday tenant by that name on that wdN — wrong tenant, wrong wd
#         number, or the company simply isn't on Workday
#   401 = internal-only board; skip it
#
# `enabled: false` parks an entry. `ci: false` skips it in GitHub Actions.

companies:
  # ---- Chip / silicon -------------------------------------------------------
  - name: NVIDIA
    type: workday
    tenant: nvidia
    wd: wd5
    site: NVIDIAExternalCareerSite
    search_text: Israel

  - name: Intel
    type: workday
    tenant: intel
    wd: wd1
    site: External
    search_text: Israel

  - name: Marvell
    type: workday
    tenant: marvell
    wd: wd1
    site: MarvellCareers
    search_text: Israel

  - name: Cadence
    type: workday
    tenant: cadence
    wd: wd1
    site: External_Careers
    search_text: Israel

  - name: Applied Materials
    type: workday
    tenant: amat            # not `appliedmaterials`
    wd: wd1
    site: External
    search_text: Israel

  # Broadcom and Analog Devices deliberately have no `search_text`: their CXS search
  # matches title/description text only, not location, so `search_text: Israel`
  # silently returns zero. Pulled unfiltered and narrowed by the location filter
  # in roles.yaml instead.
  - name: Broadcom
    type: workday
    tenant: broadcom
    wd: wd1
    site: External_Career

  - name: Analog Devices
    type: workday
    tenant: analogdevices
    wd: wd1
    site: External

  - name: Mobileye
    type: lever
    board: mobileye
    region: eu              # US endpoint 404s for this board

  - name: Tenstorrent
    type: greenhouse
    board: tenstorrent

  - name: SambaNova
    type: greenhouse
    board: sambanovasystems

  - name: Cerebras
    type: ashby
    board: cerebras

  - name: Etched
    type: ashby
    board: etched

  # ---- AI labs --------------------------------------------------------------
  - name: Anthropic
    type: greenhouse
    board: anthropic

  - name: OpenAI
    type: ashby
    board: openai

  # ---- Israeli tech (Linux / backend / AI roles) ----------------------------
  - name: Via
    type: greenhouse
    board: via

  - name: Similarweb
    type: greenhouse
    board: similarweb

  - name: Riskified
    type: greenhouse
    board: riskified

  - name: Lightricks
    type: greenhouse
    board: lightricks

  # ---- Known-unreachable, documented so nobody re-tries them ----------------
  # These are big Israeli chip employers that this tool cannot reach today. Each was
  # probed across wd1/wd3/wd5 and every plausible tenant name; none has a public
  # Workday, Greenhouse, Lever or Ashby board. Supporting them means writing a new
  # adapter for the ATS named against each.
  #
  #   Qualcomm            Eightfold AI  (app.eightfold.ai/careers?domain=qualcomm.com)
  #   Synopsys            Avature       (synopsys.avature.net)
  #   AMD                 iCIMS         (careers-amd.icims.com)
  #   Arm                 iCIMS         (experienced-arm.icims.com)
  #   Texas Instruments   Oracle HCM    (careers.ti.com)
  #   Hailo, NextSilicon, Ceva          Comeet — needs a per-company API token
  #   Apple, Western Digital            Workday exists but returns 401 (internal)
  #   Google, Microsoft, Amazon, Nokia  proprietary career sites
  #
  # Until then these are best covered by the LinkedIn/Indeed sweeps below, which do
  # surface Qualcomm and Google Israel postings.

  # ---- LinkedIn + Indeed sweeps via jobspy ----------------------------------
  # Installed by default via requirements.txt. Verified working for Israel on
  # 2026-07-20 from a residential IP: both boards returned real, on-topic Israeli
  # postings. LinkedIn blocks datacenter IPs, so these are `ci: false` — run them
  # locally. Glassdoor is unsupported (no Israel domain; it aborts the batch).
  #
  # One entry per search term: these are keyword searches, not full board dumps,
  # so each role you care about needs its own sweep.
  - name: LinkedIn/Indeed — verification
    type: jobspy
    ci: false
    sites: [indeed, linkedin]
    search_term: verification engineer
    location: Israel
    country: israel
    results: 50
    hours_old: 336

  - name: LinkedIn/Indeed — chip design
    type: jobspy
    ci: false
    sites: [indeed, linkedin]
    search_term: ASIC RTL design engineer
    location: Israel
    country: israel
    results: 50
    hours_old: 336

  - name: LinkedIn/Indeed — linux
    type: jobspy
    ci: false
    sites: [indeed, linkedin]
    search_term: linux embedded developer
    location: Israel
    country: israel
    results: 50
    hours_old: 336
