  # ---- Big tech via their own public career APIs (not a third-party ATS) -----
  # These run their own careers sites, but each exposes a public JSON search with a
  # server-side location filter — so we can pull just the Israel roles, same as an ATS.
  - name: Amazon               # Annapurna Labs silicon (Graviton/Trainium) + AWS + Stores
    type: amazon
    location: Israel
    country: ISR

  # Qualcomm and Microsoft both run Eightfold's public "PCSX" search API (same shape,
  # different host+domain — see jobradar/sources/eightfold.py).
  - name: Qualcomm             # Snapdragon modem/RF/camera silicon — ASIC, firmware, validation
    type: qualcomm
    location: Israel

  - name: Microsoft            # Azure / security / AI R&D (Herzliya, Haifa, Tel Aviv)
    type: microsoft
    location: Israel

  # Google has no clean API left — this reads the careers-page batchexecute RPC. It's the
  # most fragile source (a Google deploy can rotate the RPC id, which `check` will catch);
  # worth it for ~100 IL roles incl. silicon validation and CPU design verification.
  - name: Google               # silicon validation, CPU DV, TPU, SoC power + SWE/AI
    type: google
    location: Israel

  # Texas Instruments on Oracle Recruiting Cloud. host/site/location_id were read off the
  # careers.ti.com hcmRestApi XHR; location_id is the Israel GeographyId facet.
  - name: Texas Instruments    # Ra'anana chip R&D — design verification, digital design, emulation
    type: oracle
    host: edbz.fa.us2.oraclecloud.com
    site: CX
    location_id: "300000000361478"
    job_url: "https://careers.ti.com/job/{id}"

  # ---- Israeli defense / aerospace primes ------------------------------------
  # Elbit runs its own Next.js careers site (elbitsystemscareer.com) that hydrates from a
  # single static JSON blob — /cron/jobs.json, ~680 open reqs WITH full descriptions, so
  # `scan --deep` catches the RF / DSP / FPGA / HW-verification roles whose title is
  # generic. Every posting on that portal is an Israel role (the JSON's `area` — North /
  # Center / Sharon / Shfela / South / Haifa / Jerusalem — is kept as location context).
  # No token, no auth; the detail page is /job/?jid={jobId}.
  - name: Elbit Systems        # radar/EW/C4I/avionics — RF, DSP, FPGA, HW verification (Netanya/Haifa/Holon/Ra'anana)
    type: elbit

  # IAI's careers site (jobs.iai.co.il) is WordPress behind a Reblaze WAF, but the WAF
  # only challenges the page nav — NOT the static jobs feed it loads. So a plain GET of
  # that asset returns all ~470 reqs (see jobradar/sources/iai.py). Content is HEBREW,
  # which is why roles.yaml carries Hebrew keywords (אימות/מכ"ם/עיבוד אותות/…) alongside
  # the Latin acronyms (RF/FPGA/DSP) that Israeli titles keep inline. Elta (IAI's radar/EW
  # subsidiary) posts into this same feed.
  - name: IAI                  # Israel Aerospace Industries (+ Elta) — RF, FPGA, DSP, אימות, מכ"ם
    type: iai

  # Rafael's /api/jobs (~320 reqs) IS behind the Reblaze wall, so this one board drives a
  # real browser (Playwright + system Chrome) to pass the challenge — hence `ci: false` and
  # the optional playwright dep (see requirements.txt). Title-only, Hebrew. If Playwright
  # isn't installed it fails loudly for just this board; everything else keeps working.
  # Set `browser_channel: chromium` to use a Playwright-managed browser instead of Chrome.
  - name: Rafael               # Rafael Advanced Defense Systems — FPGA/ASIC, RFIC, וריפיקציה, אלגוריתמים (Haifa)
    type: rafael
    ci: false

  # ---- Wired up but currently empty/thin (ready for when they post IL roles) --
  # Added so a future scan picks them up automatically. All verified live: the adapter
  # resolves; there just aren't (m)any Israel roles right now. `check` will show these
  # EMPTY (except Arm's ~2) until that changes — that's expected, not a failure.
  - name: Vayyar               # radar chips (Yehud) — Workable board, currently empty
    type: workable
    board: vayyar

  # AMD has no country filter, so its adapter pages the whole board (~1000 jobs) and keeps
  # country_code == IL — heavy, and 0 IL today, so ci:false (run it locally on demand).
  - name: AMD                  # ex-Xilinx Israel R&D — 0 public IL reqs right now
    type: amd
    ci: false

  # Arm and Synopsys are HTML-only (no JSON feed) — narrow, isolated scrapers, so ci:false.
  # Arm has ~2 Ra'anana verification roles; Synopsys' Israel facet is empty right now.
  - name: Arm                  # careers.arm.com/search-jobs/Israel (HTML) — GPU/DV verification
    type: arm
    ci: false
    location: Israel

  - name: Synopsys             # synopsys.avature.net (HTML) — 21374 = Israel country facet
    type: avature
    ci: false
    host: synopsys.avature.net
    filter: "2001=21374&2001_format=3135&listFilterMode=1"

  # ---- Known-unreachable, documented so nobody re-tries them ----------------
  # Probed live and still out — no public JSON/HTML we can consume today:
  #
  #   Tower      jobs live in legacy SuccessFactors (career2.successfactors.eu, company
  #              towersemic) behind the AjaxService — session cookie + CSRF `ajaxSecKey`,
  #              no public JSON. The WordPress shell (careers.towersemi.com) just links out
  #              to it. Doable as a 2-step session scrape, but fragile; not worth it yet.
  #   Nokia      Avature — not yet probed (the `avature` type would likely fit).
  #   Apple, Western Digital   Workday exists but returns 401 (internal).
  #
  #   (IAI/Elta and Rafael WERE listed here as Reblaze-walled. Both are now wired up in the
  #   defense/aerospace section: IAI via its ungated static feed, Rafael via a browser-backed
  #   adapter — see above. Only the entries above remain genuinely out.)
  #
  # Israeli chip firms whose jobs live only on their own site (no third-party ATS):
  #   Valens (WordPress), Weebit Nano (own site), Silicom (WP job-openings), Speedata
  #   (Wix — has live VLSI/DV roles, apply by email), SatixFy (acquired by MDA Space).
  #   Pliops and Autotalks had Comeet boards now deactivated/empty (Autotalks -> Qualcomm).
  #   Run:ai is now NVIDIA — covered by the NVIDIA Workday entry above.
  #
  # These are otherwise best covered by the LinkedIn/Indeed sweeps below.

  # ---- LinkedIn + Indeed + Google-for-Jobs sweeps via jobspy ----------------
  # Installed by default via requirements.txt. Verified working for Israel on
  # 2026-07-20 from a residential IP: the boards returned real, on-topic Israeli
  # postings. LinkedIn and Google-for-Jobs block datacenter IPs, so these are
  # `ci: false` — run them locally. Glassdoor is unsupported (no Israel domain; it
  # aborts the batch).
  #
  # `google` here is Google *for Jobs* (an aggregator over many boards), not
  # Google-the-employer (that's the `google` company entry above). Its scraper wants
  # a natural-language query, so each sweep carries a `google_search_term`.
  #
  # One entry per search term: these are keyword searches, not full board dumps,
  # so each role you care about needs its own sweep.
  - name: LinkedIn/Indeed/Google — verification
    type: jobspy
    ci: false
    sites: [indeed, linkedin, google]
    search_term: verification engineer
    google_search_term: verification engineer jobs in Israel
    location: Israel
    country: israel
    results: 50
    hours_old: 336

  - name: LinkedIn/Indeed/Google — chip design
    type: jobspy
    ci: false
    sites: [indeed, linkedin, google]
    search_term: ASIC RTL design engineer
    google_search_term: ASIC RTL chip design engineer jobs in Israel
    location: Israel
    country: israel
    results: 50
    hours_old: 336

