  # ---- Optional: LinkedIn/Indeed sweep via jobspy ---------------------------
  # Needs `pip install -r requirements-jobspy.txt`. These boards block datacenter
  # IPs, so it stays out of CI — run it locally.
  - name: LinkedIn sweep (verification)
    type: jobspy
    enabled: false
    ci: false
    sites: [linkedin, indeed]
    search_term: verification engineer
    location: Israel
    country: israel
    results: 50
