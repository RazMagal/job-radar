# Which CV to send for which role.
#
# The tool tells you which CV a job wants; it does NOT store or send the file. Keep the
# actual PDFs/DOCX in cv/ (gitignored) — they're personal data and must never reach the
# public repo or the published page. Only this mapping is tracked, and only the `label`
# is ever shown on the page.
#
#   label  what shows on each matching job's card ("send: <label>")
#   file   the file in cv/ (`cv list` warns if it's missing)
#   roles  role ids from roles.yaml this CV covers (verification, chip-design, linux, ai)
#
# This mapping is the DEFAULT recommendation. `scan --deep` reads the text of the files
# below plus each job's description and can overrule the default per job when the
# description clearly fits another CV better — a "Systems Engineer" posting whose body is
# all UVM gets the verification CV. A plain scan never opens the files.
#
# Each role should map to exactly one CV. If two CVs claim the same role, the first
# listed wins and `cv list` flags it.

cvs:
  - label: Verification
    file: verification.pdf
    roles: [verification]

  - label: Chip Design
    file: chip-design.pdf
    roles: [chip-design]

  - label: Linux
    file: linux.pdf
    roles: [linux]

  - label: AI Research
    file: ai-research.pdf
    roles: [ai]
