# What counts as a job worth seeing.
#
# Score = 3 per `match_any` keyword in the TITLE + 1 per `boost` keyword. A job needs
# `min_score` to show up, so by default at least one primary keyword must appear in the
# title.
#
# `scan --deep` additionally scans the job DESCRIPTION: two or more distinct `match_any`
# keywords in the body (worth 2 each) can pull in a posting whose title gave nothing away
# — e.g. a "VLSI Engineer" or "Systems Engineer" role that is really chip design or
# verification. That only works for sources whose listing returns descriptions
# (greenhouse/ashby/lever/jobspy); Workday stays title-only. So keep `match_any` full of
# the real role vocabulary, not just the exact job titles — it doubles as the body-scan
# dictionary.
#
# Some boards post in HEBREW (IAI, and the Indeed-IL sweeps), so each profile also carries
# Hebrew keywords (אימות, מכ"ם, עיבוד אותות, קושחה, אלגוריתמ, …) next to the English ones.
# Israeli titles keep the Latin acronyms (RF/FPGA/DSP/VLSI) inline, so those match as-is.
# The English-only boards are unaffected. `normalize()` strips punctuation, so a term like
# מכ"ם is matched on its letters — that's fine, it stays unambiguous.

settings:
  # Keep only jobs whose location contains one of these. Substring, case-insensitive.
  # Jobs with a blank location are kept (better a false positive than a missed match).
  # Empty this list to go worldwide.
  locations_any:
    - israel
    - tel aviv
    - ramat gan
    - herzliya
    - haifa
    - netanya
    - raanana
    - petah tikva
    - yokneam
    - jerusalem
    - beer sheva
  # `remote` was here and pulled in US roles: postings like
  # "Remote-Friendly (Travel-Required) | San Francisco, CA" contain the word but
  # are not remote-from-Israel. Add it back only if you want those too.
  #
  # Indeed returns Hebrew place names ("תל אביב -יפו, TA, IL") while the ATS APIs
  # return English, so both spellings have to be here or the jobspy source's
  # results get silently filtered out. (Matching on the "IL" suffix instead would
  # also match Illinois, Milan, and anything else containing "il".)
    - ישראל
    - תל אביב
    - חיפה
    - ירושלים
    - פתח תקווה
    - הרצליה
    - רעננה
    - נתניה
    - רמת גן
    - באר שבע
    - יקנעם
    - כפר סבא
    - מגדל העמק
    - קיסריה

  # Anything with these in the title is dropped regardless of role.
  exclude_titles:
    - intern
    - internship
    - student
    - director
    - vp
    - vice president
    - recruiter
    - sales
    - account executive
    # Hebrew equivalents, for the Hebrew boards (IAI, Indeed-IL):
    - סטודנט          # student
    - מתמחה           # intern / trainee

  min_score: 3

profiles:
  - id: verification
    label: Verification Engineer
    match_any:
      - verification engineer
      - design verification
      - dv engineer
      - functional verification
      - silicon validation
      - post silicon
      - hw verification      # Elbit et al. title HW verification/validation this way
      - hardware verification
      - verification
      - אימות               # (Hebrew) verification — "מהנדס/ת אימות"
      - וריפיקציה           # (Hebrew) verification, transliterated
    boost:
      - uvm
      - systemverilog
      - asic
      - soc
      - formal
      - rtl
      - emulation
      - fpga
      - senior
      - staff
    exclude:
      - software verification
      - test automation engineer
      - qa

  - id: chip-design
    label: Chip Design / RTL
    match_any:
      - rtl design
      - asic design
      - asic engineer
      - chip design          # also catches "Chip Designer", "Analog Chip Designer"
      - digital design
      - logic design
      - physical design
      - soc design
      - vlsi                 # "VLSI Engineer" et al. — often the title for a DV/PD role
      - analog design
      - mixed signal         # "mixed-signal" normalises to this too
      - dft                  # design-for-test
      - place and route
      - microarchitecture
      - micro architecture   # hyphenated form normalises to this
      - cpu architect
      - gpu architect
      - silicon design
      - custom layout
      - fpga
      - תכן לוגי             # (Hebrew) logic design — "תכן לוגי ל-FPGA"
      - תכן דיגיטלי          # (Hebrew) digital design
    boost:
      - systemverilog
      - verilog
      - vhdl
      - synthesis
      - timing
      - floorplan
      - pnr
      - cpu
      - gpu
      - npu
      - senior
      - staff

  - id: rf-dsp
    label: RF / DSP
    match_any:
      - rf engineer
      - rf design
      - radio frequency
      - rfic                 # "RFIC"
      - rf ic                # "RF IC" normalises here
      - microwave
      - antenna
      - electromagnetic      # e.g. "RF Electromagnetic Engineer"
      - radar
      - signal processing    # covers "digital signal processing" too
      - dsp                  # "DSP Engineer", "DSP/FPGA"
      - baseband
      - modem
      - transceiver
      - עיבוד אותות          # (Hebrew) signal processing
      - רדאר                 # (Hebrew) radar
      - 'מכ"ם'               # (Hebrew) radar (military term) — quoted: the " is literal
      - אנטנה                # (Hebrew) antenna
      - מיקרוגל              # (Hebrew) microwave
    boost:
      - fpga
      - matlab
      - simulink
      - phased array
      - mmwave
      - millimeter wave
      - beamforming
      - 5g
      - wireless
      - senior
      - staff
    exclude:
      # radar/RF appear in non-engineering titles — keep those out.
      - marketing
      - business development
      - sales

  - id: linux
    label: Linux / Embedded
    match_any:
      - linux
      - embedded software
      - embedded sw           # "Embedded SW Engineer"
      - embedded engineer
      - kernel
      - device driver
      - firmware
      - systems engineer
      - bsp
      - לינוקס               # (Hebrew) linux
      - קושחה                # (Hebrew) firmware
      - מוטמע                # (Hebrew) embedded
      - משובץ                # (Hebrew) embedded (alt. spelling)
    boost:
      # NOT c++: matching is substring-on-normalized-text, and normalize("c++") is
      # just "c" — which boosts nearly every title into this profile.
      - rust
      - kernel
      - low level
      - performance
      - senior
      - staff
    exclude:
      - sales engineer

  - id: ai
    label: AI / ML Research
    match_any:
      - machine learning
      - deep learning
      - ai researcher
      - research scientist
      - research engineer
      - ml engineer
      - mlops
      - computer vision
      - nlp
      - אלגוריתמ             # (Hebrew) stem of algorithm* — "אלגוריתמאי/ת", "אלגוריתמים"
      - ראייה ממוחשבת        # (Hebrew) computer vision
      - עיבוד תמונה          # (Hebrew) image processing
      - למידת מכונה          # (Hebrew) machine learning
      - בינה מלאכותית        # (Hebrew) artificial intelligence
    boost:
      - pytorch
      - llm
      - inference
      - training
      - accelerator
      - cuda
      - senior
      - staff
